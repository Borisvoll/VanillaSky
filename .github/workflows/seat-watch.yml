name: Watch Vanilla Sky seat availability (cancellations)

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort (often slips to
    # ~hourly), but this is as tight as it's sensible to poll a small site
    # whose booking search we replay per date.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a fake "seat available" alert to verify Telegram + phone pipeline'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vanillasky-seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run seat-availability check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: node scripts/seat-watch.mjs

      - name: Commit updated seat status (if changed)
        run: |
          if [ -n "$(git status --porcelain -- docs/data/seat-state.json)" ]; then
            git config user.name "vanillasky-watcher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/data/seat-state.json
            git commit -m "chore: update seat availability [skip ci]"
            git push
          else
            echo "No change to commit."
          fi
